<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#18223c" />
    <title>Latitude — Offline</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#18223c;color:#f7f8ff;font-family:Arial,sans-serif}.card{max-width:520px}.mark{width:48px;height:48px;display:grid;place-items:center;margin-bottom:34px;border-radius:8px;background:#a9c5ff;color:#18223c;font-size:26px;font-weight:900}h1{margin:0 0 16px;font-size:42px;line-height:1}p{margin:0;color:#b7c0d8;font-size:17px;line-height:1.6}button{margin-top:28px;padding:12px 18px;border:0;border-radius:4px;background:#a9c5ff;color:#18223c;font-weight:700;cursor:pointer}
    </style>
  </head>
  <body><main class="card"><div class="mark">L</div><h1>You’re offline.</h1><p>Previously visited Latitude lessons remain available. Reconnect to load anything that has not been cached yet.</p><button onclick="location.reload()">Try again</button></main></body>
</html>
